<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulário de devs</title>
  </head>
  <body>  
    <div>
      <h1>Formulário</h1>
      <form method="get" >
        <label for="inome">Nome: </label>
        <input type="text" placeholder="Digite seu nome" name="nome"  id="inome" required>
        <label for="iemail">Email: </label>
        <input type="email" placeholder="Digite seu melhor email" name="email" id="iemail" required>
        <label for="icomentario">Comentário: </label>
        <textarea placeholder="Faça seu comentário" name="comentario" id="icomentario"></textarea>
        <button type="submit" ><h3>Enviar</h3></button>
      </form>
    </div>
    
  </body>
</html>
