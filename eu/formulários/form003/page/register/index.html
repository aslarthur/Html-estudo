<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../../style/style..css">
        <link rel="shortcut icon" href="../../img/favicon.png">
        <title>Tela de cadastro</title>
    </head>
    <body>
        <div class="principal">
            <h1>Cadastro</h1>
            <hr class="top">
            <form method="post" autocomplete="on">
                <div>
                    <label for="inome">Nome</label>
                    <input type="text" name="nome" id="inome" placeholder="Digite seu nome completo" required>
                </div>
                <div>
                    <label for="idata">Data de nascimento</label>
                    <input type="date" name="data" id="idada" placeholder="Digite a data que você nasceu" required>
                </div>
                <div>
                    <label for="iemail">Email</label>
                    <input type="email" name="email" id="iemail" placeholder="Digite seu email" minlength="5" required>
                </div>
                <div>
                    <label for="isenha">Senha</label>
                    <input type="password" name="senha" id="isenha" placeholder="Digite sua senha" minlength="5" required>
                </div>
                <button type="submit">Enviar</button>
            </form>
            <div class="fundo">
                <a href="../auth/index.html">Já tenho uma conta</a>
                <hr>
            </div>
        </div>
    </body>
</html>
