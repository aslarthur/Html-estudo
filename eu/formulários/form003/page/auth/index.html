<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../../style/style..css">
        <link rel="shortcut icon" href="../../img/favicon.png">
        <title>Tela de login</title>
    </head>
    <body>
        <div class="principal">
            <h1>Login</h1>
            <hr class="top">
            <form method="post" autocomplete="on">
                <div>
                    <label for="iemail">Email</label>
                    <input type="email" name="email" id="iemail" placeholder="Digite seu email" minlength="5" required>
                </div>
                <div>
                    <label for="isenha">Senha</label>
                    <input type="password" name="senha" id="isenha" placeholder="Digite sua senha" minlength="5" required>
                </div>
                <button type="submit">Enviar</button>
            </form>
            <div class="fundo">
                <a href="../register/index.html">Ainda não tenho uma conta</a>
                <hr>
            </div>
        </div>
    </body>
</html>
