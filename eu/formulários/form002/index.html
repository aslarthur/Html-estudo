<!DOCTYPE html>
<hmtl lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Formulários</title>
    </head>
    <body>
        <div>
            <h1>Formulário de devs</h1>
            <form method="post" autocomplete="off">
                <label for="inome">Nome</label>
                <hr>
                <input type="text" name="nome" id="inome" placeholder="digite seu nome aqui" required>
                <label for="iemail">Email</label>
                <hr>
                <input type="email" name="email" id="iemail" placeholder="digite seu email aqui" required>
                <label for="isenha">Senha</label>
                <hr>
                <input type="password" name="senha" id="isenha" placeholder="digite sua senha aqui" required>
                <button type="submit">Enviar</button>
            </form> 
        </div>
    </body>
</hmtl>
