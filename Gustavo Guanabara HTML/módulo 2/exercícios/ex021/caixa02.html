<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale:1.0">
        <title>Grouping Tags</title>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
                background-color: dimgray;
                margin: 0;
            }
            header{
                background-color: white;
                padding: 10px;
                margin: 10px;
                border-radius: 10px;
                text-align: center;
            }
            main{
                background-color: white;
                padding: 10px;
                margin: 10px;
                 border-radius: 10px 0px;
                 box-shadow: 4px 4px 9px 0px rgba(0, 0, 0, 0.466);
            }
            article{
                background-color: lightgray;
                padding: 5px;
            }
            article > aside{
                background-color: rgb(165, 165, 165);
            }
            nav{
                background-color: rgb(102, 102, 102);
                padding: 3px;
                box-shadow: 5px 3px 7px 1px hsla(0, 0%, 0%, 0.400);
                border-radius: 5px;
                display: inline-block;
            }
            nav > a{
                text-decoration: none;
                color: white;
                font-weight: bold;
                margin-right: 30px;
            }
            nav > a:hover{
                text-decoration: underline;
            }
            footer{
                background-color: black;
                color: white;
                padding: 4px;
                text-align: center;
            }
            footer > p{
                margin: 0px;
            }
            div#bola{
                width: 300px;
                height:300px;
                background-color: white;
                margin: 20px auto 20px auto;
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
            }

        </style>
    </head>
    <body>
        <header>
            <h1>Meu site</h1>
            <nav>
                <a href="#">link</a>
                <a href="#">link</a>
                <a href="#">link</a>
                <a href="#">link</a>
                <a href="#">link</a>
                <a href="#">link</a>
            </nav>
        </header>
        <main>
            <section id="assuntos">
                <p>Esportes Política Tecnologia</p>
            </section>
            <section id="noticias">
                <article>
                    <h2>Noticia sobre o Brasil</h2>
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod.</p>
                    <aside>
                        <p>Artigo escrito por josé da silva</p>
                    </aside>
                </article>
                <article>

                </article>
            </section>
        </main>
        <footer>
            <p>Desenvolvido pelo Arthur Santana</p>
        </footer>
        <div id="bola">
            <div class="bola_pequena"></div>
        </div>
    </body>
</html>
