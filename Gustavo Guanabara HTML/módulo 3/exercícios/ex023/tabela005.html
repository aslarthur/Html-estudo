<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Exercício de Tabelas</title>
        <style>
            body{
                font-family: Arial, Helvetica, sans-serif;
            }
            table{
                width: 700px;
                border-collapse: collapse;
            }
            caption{
                font-size: 1.3em;
                font-weight: bolder;
                padding: 8px;
            }
            th, td{
                border: 1px solid black;
                padding: 8px;
            }

            .principal{
                background-color: chartreuse;
            }

            col.nome{
                background-color: chartreuse;
            }
            .amarelo{
                background-color: yellow;
            }
            .vermelho{
                background-color: red;
            }
        </style>
    </head>
    <body>
        <h1>Exercício de Tabelas</h1>
        <table>
            <colgroup>
                <col class="amarelo">
                <col class="vermelho">
                <col class="amarelo">
                <col class="vermelho">
            </colgroup>
            <caption>Cadastro</caption>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Sexo</th>
                <th scope="col">Idade</th>
                <th scope="col">Profissão</th>
            </tr>
            <tr>
                <td>Ana Maria</td>
                <td>F</td>
                <td>25</td>
                <td>Jornalista</td>
            </tr>
            <tr>
                <td>Pedro Henrique</td>
                <td>M</td>
                <td>32</td>
                <td>Programador</td>
            </tr>
            <tr>
                <td>Sophia Victoria</td>
                <td>F</td>
                <td>28</td>
                <td>Médica</td>
            </tr>
            <tr>
                <td>Paulo Cesar</td>
                <td>M</td>
                <td>36</td>
                <td>Professor</td>
            </tr>
            <tr>
                <td>Arthur Santana</td>
                <td>M</td>
                <td>11</td>
                <td>Estudante de programação</td>
            </tr>
        </table>
    </body>
</html>
